name: Release

on:
  # Manual runs are a pack dry-run only; the publish steps below are gated on a tag ref.
  workflow_dispatch:
  push:
    tags:
      # MinVer TagPrefix is `v`; prerelease identifiers use a hyphen (e.g. v2.0.0-preview.1).
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # MinVer needs full history + tags to compute the package version from this tag.
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
            11.0.x
          dotnet-quality: preview

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Package
        run: bash ./build/pack.sh nupkgs

      - name: Assert pack layout
        run: bash ./build/assert-pack-layout.sh nupkgs

      # Publishing is tag-only: a workflow_dispatch run stops here as a pack dry-run, so an
      # untagged commit can never push MinVer's height-suffixed version (e.g. 2.0.0-preview.1.5).
      - name: Push to NuGet
        if: startsWith(github.ref, 'refs/tags/v')
        run: >
          dotnet nuget push "./nupkgs/*.nupkg"
          --source "https://api.nuget.org/v3/index.json"
          --api-key ${{ secrets.NUGETPUBLISHKEY }}
          --skip-duplicate

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: ncipollo/release-action@v1
        with:
          generateReleaseNotes: 'true'
          # Preview tags (v2.0.0-preview.N) stay prerelease and never become "latest".
          prerelease: ${{ contains(github.ref_name, '-') }}
          makeLatest: ${{ !contains(github.ref_name, '-') }}
